repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml

  - repo: local
    hooks:
      # Domain boundaries — documentation does not enforce architecture, a failing build does
      #
      # ⚠️  PYTHONUTF8=1 is mandatory on Windows:
      #     without it project files are read as cp1252 and the run collapses on
      #     the first Arabic character in a comment or a string.
      - id: lint-imports
        name: فرض حدود النطاقات
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
        env:
          PYTHONUTF8: '1'

      - id: django-check
        name: فحص Django
        entry: python manage.py check
        language: system
        pass_filenames: false
        types: [python]

      - id: missing-migrations
        name: لا migrations منسية
        entry: python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        types: [python]
