[project]
name = "medical-commerce-platform"
version = "0.5.0"
requires-python = ">=3.11"

# ═══════════════════════════════════════════════════════════
#  Ruff — lint + تنسيق
# ═══════════════════════════════════════════════════════════

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "*/migrations/*", "full-temp", "static", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DJ", "S", "RUF"]
ignore = [
    "S101",    # assert مسموح
    "RUF001",  # محارف عربية تشبه لاتينية — مقصودة
    "RUF002",
    "RUF003",
    "RUF012",  # ClassVar على سمات Django
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S311"]
"config/settings/*" = ["F403", "F405", "E402"]
"core/models/__init__.py" = ["F401"]
"core/api/__init__.py" = ["F401"]
# أسماء أكواد أخطاء لا أسرار — TOKEN_EXPIRED/TOKEN_INVALID
"core/errors.py" = ["S105"]
# object_id نصي ليستوعب UUID وBigInt معًا في مرجع عام؛
# null=True مقصود لأن القيد قد لا يرتبط بكائن
"core/models/audit.py" = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = [
    "core", "branding", "accounts", "customers", "administration",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
    "academic", "notifications", "devtools", "ops", "seo", "pos", "finance", "b2b",
    "employees", "targets", "commissions", "suppliers", "reporting",
    "config",
]

# ═══════════════════════════════════════════════════════════
#  pytest
# ═══════════════════════════════════════════════════════════

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers -q"
testpaths = [
    "core", "accounts", "customers", "administration", "branding",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
    "academic", "notifications", "devtools", "ops", "seo", "pos", "finance", "b2b",
    "employees", "targets", "commissions", "suppliers", "reporting",
]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", ".venv/*", "config/*", "manage.py"]

# ═══════════════════════════════════════════════════════════
#  import-linter — فرض حدود النطاقات
# ═══════════════════════════════════════════════════════════
#  التوثيق لا يفرض معمارية. فشل البناء يفرضها. (ADR-08)
#  انظر docs/backend/02-DEPENDENCIES.md
# ═══════════════════════════════════════════════════════════

[tool.importlinter]
root_packages = [
    "core", "branding", "accounts", "customers", "administration",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
    "academic", "notifications", "devtools", "ops", "seo", "pos", "finance", "b2b",
    "employees", "targets", "commissions", "suppliers", "reporting",
]

[[tool.importlinter.contracts]]
name = "Domain layering - dependencies flow downward only"
type = "layers"
# ⚠️  `access` تحت `catalog` لا فوقه.
#
#     يعتمد على accounts + core فقط، **ويستهلكه الجميع**:
#     catalog · cart · orders · البحث. وضعه فوق catalog كان خطأً
#     في العقد خالف ما توثّقه docs/backend/02-DEPENDENCIES.md،
#     وأمسكه import-linter عند أول استيراد فعلي.
layers = [
    # ⚠️  `devtools` فوق الجميع — يستورد كل شيء ولا يستورده أحد.
    #
    #     بذرة البيانات تلمس كل نطاق؛ وضعها داخل أحدها يجعله يعتمد
    #     على نطاقات لا علاقة له بها فيكذب المخطط. وهي غير مثبّتة
    #     خارج بيئة التطوير أصلًا (config/settings/dev.py).
    "devtools",
    # ⚠️  `reporting` تحت `devtools` وفوق الجميع.
    #
    #     يقرأ كل نطاق ولا يكتب في أيٍّ منها، ولا نطاق يستورده.
    #     وضعه أدنى كان يمنعه من قراءة ما فوقه — وهو تقرير يجب أن
    #     يرى كل شيء بحكم تعريفه.
    "reporting",
    # ⚠️  `ops` فوق نطاقات العمل وتحت `devtools`.
    #
    #     أوامر التشغيل تمسّ `inventory` و`cart` معًا؛ وضعها في
    #     أحدهما يجعله يستورد الآخر، وفي `core` يجعل البنية التحتية
    #     تعرف نطاقات العمل. ولا تصلح `devtools` لأنه غير مثبّت في
    #     الإنتاج — والمهام الدورية تعمل هناك قبل أي مكان آخر.
    #
    # ⚠️  و`seo` بجواره لا داخل `catalog`.
    #
    #     خريطة الموقع تجمع منتجات `catalog` وحزم `academic`
    #     وترشّحهما بـ `access` — وهما شقيقان في الطبقة نفسها لا
    #     يستورد أحدهما الآخر.
    "ops | seo",
    # ⚠️  `commissions` **فوق `targets` و`finance` معًا**.
    #
    #     العمولة على الربح تحتاج `finance.COGSEntry` — وهي التكلفة
    #     المحسوبة من الدفعة التي خرجت فعلًا. حسابها هنا من جديد
    #     يُنتج رقم ربح يخالف قائمة الأرباح، ولا أحد يعرف أيّهما
    #     يُصدَّق حين تُصرَف عمولة على أحدهما.
    "commissions",
    "targets",
    # ⚠️  `b2b` و`finance` شقيقان فوق `pos` و`orders`.
    #
    #     كلاهما يستهلك الطلبات ولا يستورد الآخر: المالية تسأل «كم
    #     ربحنا؟» وB2B يسأل «كم على هذا العميل؟». خلطهما كان يجعل
    #     كشف حساب صيدلية يعتمد على قيود الأرباح — وهما دفتران
    #     مختلفان لجمهورين مختلفين.
    "b2b | finance",
    # ⚠️  `employees` فوق `orders` وتحت `b2b | finance`.
    #
    #     يقرأ الطلبات لحساب الأداء وينشئها نيابةً عن العميل،
    #     ويستورد `customers` للإسناد — اتجاه نازل مسموح (ADR-12).
    #     و`customers` لا يستورده أبدًا: الحقل المعاكس كان ينشئ
    #     دائرة `customers ↔ employees`.
    "employees",
    # ⚠️  `suppliers` فوق `inventory` و`catalog` وتحت `employees`.
    #
    #     يستلم البضاعة عبر `inventory.services.receive`، ولا يعرف
    #     بوجود الطلبات ولا الموظفين إطلاقًا: الشراء واردٌ لا صادر.
    "suppliers",
    # ⚠️  `pos` **فوق** `orders` لا بديلًا عنه.
    #
    #     كل بيعة تُنتج `Order` بـ `channel=POS` عبر
    #     `orders.services.create_pos_order`. و`orders` لا يعرف
    #     بوجود نقطة البيع إطلاقًا: مدخلاته أصناف وأرقام.
    #
    #     النموذج الموازي (`POSOrder`) كان سينتج تقريرَي مبيعات
    #     ومخزونين ومصدرَي حقيقة — وأول سؤال محاسبي يكشف الفجوة
    #     بينهما بلا طريقة لحسمها.
    "pos",
    "orders",
    "cart",
    # ⚠️  `payments` **تحت** `orders` لا فوقه.
    #
    #     التبعية `orders → payments.services.charge()` — والطلب
    #     يعرف الواجهة المجرّدة لا أي بوابة بعينها. أما `payments`
    #     فلا يعرف بوجود الطلبات إطلاقًا: مرجعه نصي.
    #
    #     وضعه فوق `orders` كان خطأً في العقد خالف ما توثّقه
    #     docs/backend/02-DEPENDENCIES.md — وهو ثاني تناقض من نوعه
    #     بعد `access`.
    "payments",
    "promotions",
    "pricing | inventory | reviews",
    "customers | administration | academic | catalog | shipping",
    "access",
    "accounts",
    # ⚠️  `branding` **فوق** `core` لا شقيقًا له.
    #
    #     كان في نفس الطبقة حين كان تطبيقًا فارغًا، فلم يستورد شيئًا
    #     ولم ينكشف الخطأ. أول موديل حقيقي جعله يستورد `BaseModel`
    #     و`random_filename` — والشقيقان لا يستوردان بعضهما.
    #
    #     الترتيب الصحيح يعبّر عن الحقيقة: الهوية البصرية تستهلك
    #     البنية التحتية، ولا نطاق عمل يستهلكها.
    "branding",
    "core",
]

[[tool.importlinter.contracts]]
name = "Core is infrastructure - never imports a business domain"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "accounts", "customers", "administration", "catalog",
    "shipping", "access", "pricing", "inventory", "reviews",
    "promotions", "cart", "orders",
]

[[tool.importlinter.contracts]]
name = "Identity domains expand independently"
type = "independence"
modules = ["customers", "administration"]

[[tool.importlinter.contracts]]
# ⚠️  الدائرة التي وُجد ADR-12 ليمنعها — **مفروضة الآن لا موثَّقة فقط**.
#
#     حقل `assigned_employee` على `CustomerProfile` يبدو أبسط طريق
#     لسؤال «من المسؤول عن هذا العميل؟»، وهو بالضبط ما ينشئ
#     `customers ↔ employees`. الإسناد يملكه الطرف الأعلى
#     (`employees.CustomerAssignment`) فيبقى الاتجاه نازلًا.
#
#     العقد أعلاه لا يغطيها: `employees` لم يكن موجودًا حين كُتب،
#     وإضافته إلى `independence` كانت ستمنع الاتجاه المسموح أيضًا.
name = "Customers must never know about employees (ADR-12)"
type = "forbidden"
source_modules = ["customers"]
forbidden_modules = ["employees"]

[[tool.importlinter.contracts]]
name = "Domains never import each other models directly"
type = "forbidden"
source_modules = ["orders", "cart", "promotions"]
forbidden_modules = ["inventory.models", "pricing.models"]
# ⚠️  `allow_indirect_imports` ضروري لا تساهل.
#
#     بدونه يُرفض المسار **الصحيح** أيضًا:
#
#         orders.services → inventory.services → inventory.models
#
#     وهو بالضبط ما نريده — استدعاء الخدمة، والخدمة تعرف موديلاتها.
#     العقد يمنع الاستيراد **المباشر** لموديلات نطاق آخر، لا مرور
#     الاستدعاء عبر طبقة خدماته.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Branding is independent of business domains"
type = "forbidden"
source_modules = ["branding"]
forbidden_modules = [
    "accounts", "customers", "catalog", "orders", "cart", "inventory",
]

[[tool.importlinter.contracts]]
name = "Nothing may import notifications"
type = "forbidden"
# ⚠️  النطاقات تبعث إشارات؛ `notifications` يستمع.
#
#     الاستيراد المباشر يعني أن `inventory` يعرف بوجود البريد،
#     و`orders` يعرف قوالب الرسائل — وكل تغيير في الإشعارات يمس
#     نطاقات لا علاقة لها به.
source_modules = [
    "core", "accounts", "customers", "administration", "academic",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
]
forbidden_modules = ["notifications"]
