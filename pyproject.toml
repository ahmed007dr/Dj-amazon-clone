[project]
name = "medical-commerce-platform"
version = "0.5.0"
requires-python = ">=3.11"

# ═══════════════════════════════════════════════════════════
#  Ruff — lint + formatting
# ═══════════════════════════════════════════════════════════

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "*/migrations/*", "full-temp", "static", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DJ", "S", "RUF"]
ignore = [
    "S101",    # assert is allowed
    "RUF001",  # Arabic characters that resemble Latin ones — intentional
    "RUF002",
    "RUF003",
    "RUF012",  # ClassVar on Django attributes
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S311"]
# ⚠️  Seed randomness is a **presentation detail, not a secret**: it shapes the
#     visitor curve so the peak is visible on screen, and with a fixed seed it
#     produces the same result every time. A cryptographic generator here is slower and adds nothing.
"devtools/seeds/*" = ["S311"]
"config/settings/*" = ["F403", "F405", "E402"]
"core/models/__init__.py" = ["F401"]
"core/api/__init__.py" = ["F401"]
# Error code names, not secrets — TOKEN_EXPIRED/TOKEN_INVALID
"core/errors.py" = ["S105"]
# object_id is text so it can hold both a UUID and a BigInt in a generic reference;
# null=True is deliberate because the entry may not be tied to an object
"core/models/audit.py" = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = [
    "core", "branding", "mailing", "accounts", "customers", "administration",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
    "academic", "notifications", "devtools", "ops", "seo", "pos", "finance", "b2b",
    "employees", "targets", "commissions", "suppliers", "reporting", "loyalty",
    "analytics",
    "config",
]

# ═══════════════════════════════════════════════════════════
#  pytest
# ═══════════════════════════════════════════════════════════

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers -q"
testpaths = [
    "core", "accounts", "customers", "administration", "branding", "mailing",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
    "academic", "notifications", "devtools", "ops", "seo", "pos", "finance", "b2b",
    "employees", "targets", "commissions", "suppliers", "reporting", "loyalty",
]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", ".venv/*", "config/*", "manage.py"]

# ═══════════════════════════════════════════════════════════
#  import-linter — enforcing domain boundaries
# ═══════════════════════════════════════════════════════════
#  Documentation does not enforce architecture. A failing build does. (ADR-08)
#  See docs/backend/02-DEPENDENCIES.md
# ═══════════════════════════════════════════════════════════

[tool.importlinter]
root_packages = [
    "core", "branding", "mailing", "accounts", "customers", "administration",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
    "academic", "notifications", "devtools", "ops", "seo", "pos", "finance", "b2b",
    "employees", "targets", "commissions", "suppliers", "reporting", "loyalty",
    "analytics",
]

[[tool.importlinter.contracts]]
name = "Domain layering - dependencies flow downward only"
type = "layers"
# ⚠️  `access` sits below `catalog`, not above it.
#
#     It depends on accounts + core only, **and everyone consumes it**:
#     catalog · cart · orders · search. Placing it above catalog was a mistake
#     in the contract that contradicted docs/backend/02-DEPENDENCIES.md,
#     and import-linter caught it on the first real import.
layers = [
    # ⚠️  `devtools` above everything — it imports everything and nobody imports it.
    #
    #     The data seed touches every domain; putting it inside one of them would
    #     make that domain depend on domains it has nothing to do with, and the
    #     diagram would lie. It is not installed outside development anyway (config/settings/dev.py).
    "devtools",
    # ⚠️  `reporting` below `devtools` and above everything else.
    #
    #     It reads every domain, writes to none of them, and no domain imports it.
    #     Placing it lower would have stopped it reading what sits above — and a
    #     report must see everything by definition.
    "reporting",
    # ⚠️  `ops` above the business domains and below `devtools`.
    #
    #     Operational commands touch `inventory` and `cart` alike; putting them in
    #     either would make it import the other, and putting them in `core` would
    #     make the infrastructure know about business domains. `devtools` will not
    #     do because it is not installed in production — and periodic tasks run there before anywhere else.
    #
    # ⚠️  And `seo` sits beside it, not inside `catalog`.
    #
    #     The sitemap combines `catalog` products with `academic` bundles and
    #     filters both through `access` — siblings on the same layer, neither
    #     importing the other.
    "ops | seo",
    # ⚠️  `commissions` sits **above both `targets` and `finance`**.
    #
    #     Commission on profit needs `finance.COGSEntry` — the cost computed from
    #     the batch that actually shipped. Recomputing it here would produce a
    #     profit figure that disagrees with the P&L statement, and nobody would
    #     know which to believe once a commission is paid against one of them.
    "commissions",
    "targets",
    # ⚠️  `b2b` and `finance` are siblings above `pos` and `orders`.
    #
    #     Both consume orders and neither imports the other: finance asks "how much
    #     did we earn?" and B2B asks "how much does this customer owe?". Mixing them
    #     made a pharmacy's account statement depend on profit entries — two
    #     different ledgers for two different audiences.
    # ⚠️  `loyalty` above `b2b | finance` and below `employees`.
    #
    #     It listens for order completion and reads `customers`; redemption produces
    #     a `promotions.Coupon` instead of touching the cart or the order — the cart
    #     and the order are **below it**, and touching them would invert the direction.
    "loyalty",
    "b2b | finance",
    # ⚠️  `employees` above `orders` and below `b2b | finance`.
    #
    #     It reads orders to compute performance and creates them on the customer's
    #     behalf, and imports `customers` for assignment — a permitted downward direction (ADR-12).
    #     `customers` never imports it: the reverse field used to create a
    #     `customers ↔ employees` cycle.
    "employees",
    # ⚠️  `suppliers` above `inventory` and `catalog`, below `employees`.
    #
    #     It receives goods through `inventory.services.receive`, and knows nothing
    #     at all about orders or employees: purchasing is inbound, not outbound.
    "suppliers",
    # ⚠️  `pos` sits **above** `orders`, not as an alternative to it.
    #
    #     Every sale produces an `Order` with `channel=POS` through
    #     `orders.services.create_pos_order`. And `orders` knows nothing at all
    #     about point of sale: its inputs are items and numbers.
    #
    #     A parallel model (`POSOrder`) would have produced two sales reports, two
    #     stock figures and two sources of truth — and the first accounting question
    #     would expose the gap between them with no way to settle it.
    "pos",
    "orders",
    "cart",
    # ⚠️  `payments` sits **below** `orders`, not above it.
    #
    #     The dependency is `orders → payments.services.charge()` — and the order
    #     knows the abstract interface, never a specific gateway. `payments` in turn
    #     knows nothing at all about orders: its reference is a string.
    #
    #     Placing it above `orders` was a mistake in the contract that contradicted
    #     docs/backend/02-DEPENDENCIES.md — the second contradiction of its kind
    #     after `access`.
    "payments",
    "promotions",
    "pricing | inventory | reviews",
    "customers | administration | academic | catalog | shipping",
    # ⚠️  `analytics` is a sibling of `access`, above `accounts` and below `administration`.
    #
    #     It imports `accounts` to classify devices and knows no business domain,
    #     and `administration` reads the visitor count from it — so placing it
    #     higher would invert the direction. It never imports `reporting`: the two
    #     peak charts are parallel, not overlapping, and the permission they share
    #     lives in `core.permissions` for exactly that reason.
    "access | analytics",
    "accounts",
    # ⚠️  `branding` sits **above** `core`, not as a sibling of it.
    #
    #     It was on the same layer while it was an empty app, so it imported nothing
    #     and the mistake stayed hidden. The first real model made it import
    #     `BaseModel` and `random_filename` — and siblings do not import each other.
    #
    #     The correct order states the truth: visual identity consumes the
    #     infrastructure, and no business domain consumes it.
    # ⚠️  `mailing` is a sibling of `branding`, above `core`.
    #
    #     Both consume the infrastructure and know no business domain, and neither
    #     imports the other. `accounts` sits above them because it sends activation
    #     email — a downward direction: identity calls email, and email does not
    #     know who calls it.
    "branding | mailing",
    "core",
]

[[tool.importlinter.contracts]]
name = "Core is infrastructure - never imports a business domain"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "accounts", "customers", "administration", "catalog",
    "shipping", "access", "pricing", "inventory", "reviews",
    "promotions", "cart", "orders",
]

[[tool.importlinter.contracts]]
name = "Identity domains expand independently"
type = "independence"
modules = ["customers", "administration"]

[[tool.importlinter.contracts]]
# ⚠️  The cycle ADR-12 exists to prevent — **now enforced, not merely documented**.
#
#     An `assigned_employee` field on `CustomerProfile` looks like the simplest
#     way to answer "who owns this customer?", and it is exactly what creates
#     `customers ↔ employees`. Assignment is owned by the upper side
#     (`employees.CustomerAssignment`) so the direction stays downward.
#
#     The contract above does not cover it: `employees` did not exist when it
#     was written, and adding it to `independence` would have blocked the permitted direction too.
name = "Customers must never know about employees (ADR-12)"
type = "forbidden"
source_modules = ["customers"]
forbidden_modules = ["employees"]

[[tool.importlinter.contracts]]
name = "Domains never import each other models directly"
type = "forbidden"
source_modules = ["orders", "cart", "promotions"]
forbidden_modules = ["inventory.models", "pricing.models"]
# ⚠️  `allow_indirect_imports` is a necessity, not a concession.
#
#     Without it the **correct** path is rejected as well:
#
#         orders.services → inventory.services → inventory.models
#
#     which is exactly what we want — call the service, and let the service know its own models.
#     The contract forbids the **direct** import of another domain's models, not
#     a call passing through that domain's service layer.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Branding is independent of business domains"
type = "forbidden"
source_modules = ["branding"]
forbidden_modules = [
    "accounts", "customers", "catalog", "orders", "cart", "inventory",
]

[[tool.importlinter.contracts]]
name = "Mailing is independent of business domains"
# ⚠️  `send_to_user(user)` accepts the object without importing its type.
#
#     The first import of `accounts.User` here inverts the direction: email ends
#     up above identity while identity calls it — a cycle breakable only by an
#     import inside a function, which hides the cycle rather than resolving it.
type = "forbidden"
source_modules = ["mailing"]
forbidden_modules = [
    "accounts", "customers", "catalog", "orders", "cart", "inventory",
    "notifications", "payments",
]

[[tool.importlinter.contracts]]
name = "Nothing may import notifications"
type = "forbidden"
# ⚠️  Domains emit signals; `notifications` listens.
#
#     A direct import would mean `inventory` knows email exists and `orders`
#     knows the message templates — and every change to notifications would
#     touch domains that have nothing to do with it.
source_modules = [
    "core", "accounts", "customers", "administration", "academic",
    "catalog", "shipping", "access", "pricing", "inventory",
    "reviews", "promotions", "cart", "orders", "payments",
]
forbidden_modules = ["notifications"]
