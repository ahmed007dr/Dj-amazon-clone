<!doctype html>
<!--
  ⚠️  `lang` and `dir` are initial values only.

      `useDirection` sets them at startup and on every language switch. Fixing
      them here alone means an Arabic page with an English layout for the first
      visible moment.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>المتجر الطبي</title>

    <!--
      ⚠️  Local fonts, no blocking external request.
          An outage of the external font network leaves the text without
          suitable Arabic glyphs, which is worse than a plain system font.
    -->
    <style>
      /* لون الخلفية قبل تحميل الثيم — يمنع وميضًا أبيض في الوضع الداكن */
      :root { color-scheme: light dark; }
      html { background: #f7f8fa; }
      @media (prefers-color-scheme: dark) { html { background: #12161a; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
